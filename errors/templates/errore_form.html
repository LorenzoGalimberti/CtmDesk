{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h1>{% if form.instance.pk %}Modifica Errore{% else %}Aggiungi Errore{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Salva</button>
        <a href="{% url 'errore_list' %}" class="btn btn-secondary">Annulla</a>
    </form>
</div>
{% endblock %}
