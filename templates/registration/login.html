{% load static %}
<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - CTMDesk</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo2.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm w-100" style="max-width: 400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="{% static 'images/logo2.png' %}" alt="Logo" style="height: 60px;">
                <h1 class="h4 mt-3 mb-0">CTMDesk</h1>
                <p class="text-muted small mb-0">Accedi per continuare</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger" role="alert">Utente o password non corretti.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label for="id_username" class="form-label">Utente</label>
                    <input type="text" name="username" id="id_username" class="form-control"
                           value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Accedi</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
